name: Weekly OSM cache → Supabase
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: 'Space-separated Geofabrik slugs (default: core set; "none" = only vacuum + size report)'
        required: false
        default: ''
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium + psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool postgresql-client
      - name: Check SUPABASE_DB_URL (without printing it)
        run: |
          python3 - <<'PY'
          import os, re, sys
          v = os.environ.get("SUPABASE_DB_URL", "")
          s = v.strip().strip('"').strip("'").strip()
          probs = []
          if not v: probs.append("secret is empty or missing")
          if v != v.strip(): probs.append("leading/trailing spaces or newline (auto-fixed)")
          if s[:1] in "\"'": probs.append("wrapped in quotes (auto-fixed)")
          if not re.match(r"^postgres(ql)?://", s): probs.append("does not start with postgresql://")
          if "[YOUR-PASSWORD]" in s or "YOUR-PASSWORD" in s: probs.append("password placeholder still in the string")
          if "pooler.supabase.com" not in s: probs.append("host is not *.pooler.supabase.com (use the Session/Shared pooler string)")
          if ":5432/" not in s: probs.append("port is not 5432")
          m = re.match(r"^postgres(?:ql)?://([^:@/]+)(?::[^@]*)?@([^:/]+)", s)
          print("user:", m.group(1) if m else "?", "| host:", m.group(2) if m else "?", "| length:", len(s))
          print("problems:", "; ".join(probs) or "none")
          fatal = [p for p in probs if "auto-fixed" not in p]
          sys.exit(1 if fatal else 0)
          PY
          psql "--dbname=$(echo "$SUPABASE_DB_URL" | xargs)" -tAc "select 'connected: '||current_user||' / postgis '||postgis_lib_version();"
      - name: Load regions
        run: |
          # no 'set -e': a failed or timed-out region is skipped and the loop moves on
          FAILED=""
          REGIONS="${{ github.event.inputs.regions }}"
          if [ -z "$REGIONS" ]; then REGIONS=$(grep -v '^#' backend/regions.txt | tr '\n' ' '); fi
          if [ "$REGIONS" = "none" ]; then REGIONS=""; fi
          for R in $REGIONS; do
            SLUG=$(basename "$R")
            echo "=== $R"
            # abort a stalled download (<50 KB/s for 2 min) instead of hanging for hours
            if ! curl -sSL --retry 2 --retry-delay 30 --connect-timeout 30 --speed-limit 50000 --speed-time 120 --max-time 1500 -o "$SLUG.osm.pbf" "https://download.geofabrik.de/$R-latest.osm.pbf"; then echo "!! download failed for $R — skipping"; FAILED="$FAILED $R"; continue; fi
            ls -la "$SLUG.osm.pbf"
            # every processing step is time-capped so one region cannot stall the run
            T="timeout 1200"
            $T osmium tags-filter -o water.pbf "$SLUG.osm.pbf" \
              natural=water,coastline,spring waterway=river,canal,stream \
              man_made=water_well,water_works,wastewater_plant,desalination_plant,reservoir_covered,water_tower,pumping_station \
              landuse=reservoir,salt_pond,basin place --overwrite
            $T osmium export water.pbf -f geojsonseq -o water.geojsonseq --geometry-types=point,linestring,polygon --add-unique-id=type_id --overwrite
            $T python3 backend/load_osm.py "$SLUG" water water.geojsonseq || { echo "!! water step failed or timed out for $R — skipping"; FAILED="$FAILED $R"; rm -f *.pbf *.geojsonseq; continue; }
            $T osmium tags-filter -o power.pbf "$SLUG.osm.pbf" power=line,minor_line,cable,substation,plant,generator --overwrite
            $T osmium export power.pbf -f geojsonseq -o power.geojsonseq --geometry-types=point,linestring,polygon --add-unique-id=type_id --overwrite
            $T python3 backend/load_osm.py "$SLUG" power power.geojsonseq || { echo "!! power step failed or timed out for $R"; FAILED="$FAILED $R"; }
            rm -f "$SLUG.osm.pbf" water.pbf power.pbf water.geojsonseq power.geojsonseq
          done
          if [ -n "$FAILED" ]; then echo "Regions skipped this run (previous data kept):$FAILED"; fi
      - name: Reclaim space (VACUUM FULL) and report size
        if: always()
        run: |
          psql "--dbname=$(echo "$SUPABASE_DB_URL" | xargs)" -c "set statement_timeout = 0" -c "vacuum (full, analyze) osm_feat"
          psql "--dbname=$(echo "$SUPABASE_DB_URL" | xargs)" -tAc "select region||': water '||feat_water||', power '||feat_power from osm_region order by 1; select 'osm_feat on disk: '||pg_size_pretty(pg_total_relation_size('osm_feat'))||' | database: '||pg_size_pretty(pg_database_size(current_database()));"
