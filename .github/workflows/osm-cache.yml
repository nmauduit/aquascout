name: Weekly OSM cache → Supabase
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: 'Space-separated Geofabrik slugs (default: core set)'
        required: false
        default: ''
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium + psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool postgresql-client
      - name: Load regions
        run: |
          set -e
          REGIONS="${{ github.event.inputs.regions }}"
          if [ -z "$REGIONS" ]; then REGIONS=$(grep -v '^#' backend/regions.txt | tr '\n' ' '); fi
          for R in $REGIONS; do
            SLUG=$(basename "$R")
            echo "=== $R"
            curl -sSL --retry 3 -o "$SLUG.osm.pbf" "https://download.geofabrik.de/$R-latest.osm.pbf"
            osmium tags-filter -o water.pbf "$SLUG.osm.pbf" \
              natural=water,coastline,spring waterway=river,canal,stream \
              man_made=water_well,water_works,wastewater_plant,desalination_plant,reservoir_covered,water_tower,pumping_station,storage_tank \
              landuse=reservoir,salt_pond,basin place --overwrite
            osmium export water.pbf -f geojsonseq -o water.geojsonseq --geometry-types=point,linestring,polygon --add-unique-id=type_id --overwrite
            python3 backend/load_osm.py "$SLUG" water water.geojsonseq
            osmium tags-filter -o power.pbf "$SLUG.osm.pbf" power=line,minor_line,cable,substation,plant,generator --overwrite
            osmium export power.pbf -f geojsonseq -o power.geojsonseq --geometry-types=point,linestring,polygon --add-unique-id=type_id --overwrite
            python3 backend/load_osm.py "$SLUG" power power.geojsonseq
            rm -f "$SLUG.osm.pbf" water.pbf power.pbf water.geojsonseq power.geojsonseq
          done
