name: Bulk open datasets (HydroWASTE, salinity → Supabase; gridfinder → static tiles)
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'hydrowaste | salinity | gridfinder | all'
        required: false
        default: 'all'
      gf_quantum:
        description: 'gridfinder vertex grid in degrees (0.002 ≈ 200 m)'
        required: false
        default: '0.002'
  schedule:
    - cron: '41 4 1 */3 *'   # quarterly; these datasets are static releases
permissions:
  contents: write
jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ONLY: ${{ github.event.inputs.only || 'all' }}
      GFQ: ${{ github.event.inputs.gf_quantum || '0.002' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin postgresql-client unzip
      - name: HydroWASTE → bulk_point (wwtp)
        if: env.ONLY == 'all' || env.ONLY == 'hydrowaste'
        run: |
          curl -sSL --retry 3 --max-time 600 -o hw.zip https://figshare.com/ndownloader/files/31910714
          unzip -o -q hw.zip -d hw
          python3 backend/load_bulk.py hydrowaste hw/HydroWASTE_v10.csv
      - name: Thorslund & van Vliet salinity → bulk_point (sal_gw, sal_rv, sal_lk)
        if: env.ONLY == 'all' || env.ONLY == 'salinity'
        run: |
          B=https://hs.pangaea.de/bio/Salinity_database/Thorslund-vanVliet_2020
          for f in Groundwaters_summary Rivers_summary Lakes_Reservoirs_summary; do curl -sSL --retry 3 --max-time 900 -o $f.csv $B/$f.csv; done
          python3 backend/load_bulk.py salinity Groundwaters_summary.csv Rivers_summary.csv Lakes_Reservoirs_summary.csv
      - name: Database size
        if: env.ONLY != 'gridfinder'
        run: |
          psql "--dbname=$(echo "$SUPABASE_DB_URL" | xargs)" -c "vacuum analyze bulk_point"
          psql "--dbname=$(echo "$SUPABASE_DB_URL" | xargs)" -tAc "select theme, count(*) from bulk_point group by 1 order by 1; select 'db '||pg_size_pretty(pg_database_size(current_database()))||' · bulk_point '||pg_size_pretty(pg_total_relation_size('bulk_point'));"
      - name: gridfinder → data/gf tiles
        if: env.ONLY == 'all' || env.ONLY == 'gridfinder'
        run: |
          curl -sSL --retry 3 --max-time 2400 -o grid.gpkg "https://zenodo.org/records/3628142/files/grid.gpkg?download=1"
          rm -rf data/gf
          ogr2ogr -f GeoJSONSeq -simplify "$GFQ" /vsistdout/ grid.gpkg grid | python3 tools/gridfinder_tiles.py data/gf "$GFQ"
          du -sh data/gf; ls data/gf | wc -l
          SZ=$(du -sm data/gf | cut -f1)
          if [ "$SZ" -gt 400 ]; then echo "!! tiles are ${SZ} MB — too large for the repo; rerun with a coarser gf_quantum (e.g. 0.004)"; exit 1; fi
          git config user.name "aquascout-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/gf
          git diff --cached --quiet || (git commit -q -m "gridfinder tiles (q=$GFQ)" && git pull --rebase -q && git push -q)
