name: Probe bulk files (dev helper)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip
      - name: Thorslund salinity summaries
        run: |
          B=https://hs.pangaea.de/bio/Salinity_database/Thorslund-vanVliet_2020
          for f in Groundwaters_summary Rivers_summary Lakes_Reservoirs_summary; do
            curl -sSL --retry 3 --max-time 900 -o $f.csv $B/$f.csv; ls -la $f.csv; head -3 $f.csv | cut -c1-700; wc -l $f.csv || true
          done
      - name: gridfinder
        run: |
          curl -sSL --retry 3 --max-time 1800 -o grid.gpkg "https://zenodo.org/records/3628142/files/grid.gpkg?download=1"
          ls -la grid.gpkg
          ogrinfo -so -al grid.gpkg | head -40
